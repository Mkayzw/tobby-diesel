name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: tobby-diesel
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/mkayzw/${{ matrix.name }}:latest
            ghcr.io/mkayzw/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Coolify redeploys every resource tagged "tobby-diesel", pulling the new :latest image.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Strip a trailing slash so "https://host/" doesn't become "https://host//api/...".
          url="${COOLIFY_URL%/}/api/v1/deploy"
          echo "Calling: POST $url (tag=tobby-diesel)"
          # Newer Coolify versions only accept POST here (GET returns 405), options go in a JSON body.
          # --fail-with-body still fails the step on 4xx/5xx but prints Coolify's error message.
          curl --fail-with-body -sS -w "\nHTTP %{http_code}\n" \
            -X POST "$url" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tag":"tobby-diesel"}'
