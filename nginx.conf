server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Not a SPA: unknown paths should 404, not silently serve index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Images rarely change; let browsers cache them. CSS/JS keep default caching
    # because their filenames aren't hashed, so edits must show up on refresh.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
